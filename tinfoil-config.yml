cvm-version: 0.10.8
cpus: 32
memory: 524288
gpus: 8

models:
  - name: "deepseek-v4-flash-0731"
    repo: "deepseek-ai/DeepSeek-V4-Flash-0731@7872f01b1d1fe23eabc4c98b48bffcef5a386062"
    mpk: "9dd15749a2f9c554cefb41b9bb202c2994d64519b4efbd42af68b51e010d5e21_166898688000_8c68b40d-723e-50f0-b86b-4d3e05b5c113"

networks:
  model-net: {}

containers:
  - name: "deepseek-v4-flash-0731"
    image: "vllm/vllm-openai:v0.26.0@sha256:770fe65b2c73ee74a5c42165cf3433de4048cc2cd9c57a937ca4e35aba5aa87b"
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    command:
      [
        "--model",
        "/tinfoil/mpk/mpk-9dd15749a2f9c554cefb41b9bb202c2994d64519b4efbd42af68b51e010d5e21",
        "--trust-remote-code",
        "--kv-cache-dtype",
        "fp8",
        "--block-size",
        "256",
        "--tensor-parallel-size",
        "8",
        "--enable-expert-parallel",
        "--disable-custom-all-reduce",
        "--tokenizer-mode",
        "deepseek_v4",
        "--tool-call-parser",
        "deepseek_v4",
        "--enable-auto-tool-choice",
        "--reasoning-parser",
        "deepseek_v4",
        "--enable-prompt-tokens-details",
        "--served-model-name",
        "deepseek-v4-flash-0731",
        "glm-5-2",
        "--scheduling-policy",
        "priority",
        "--port",
        "8001",
        "--max-model-len",
        "393216",
        "--max-num-seqs",
        "256",
        "--max-num-batched-tokens",
        "8192",
        "--gpu-memory-utilization",
        "0.95",
        "--no-enable-flashinfer-autotune",
        "--compilation-config",
        '{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY"}',
        "--speculative-config",
        '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"greedy"}',
      ]
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=20g,mode=0700,exec
    networks: [model-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 20m

shim:
  # Debug-only release: route directly to vLLM and bind no production secrets.
  upstream-container: deepseek-v4-flash-0731
  upstream-port: 8001
  authenticated: false
  paths:
    - /v1/chat/completions
    - /v1/responses
    - /v1/models
    - /metrics
    - /health

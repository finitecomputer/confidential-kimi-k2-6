cvm-version: 0.10.4
cpus: 32
memory: 524288
gpus: 8

models:
  - name: "glm-5-2"
    repo: "zai-org/GLM-5.2-FP8@a0b55e88465d1a06afece97bc8d6b366aff39089"
    mpk: "98d8b697173111b91b32a4daafc179bb5d8c5dbcd8fb8732f1f73ffcbc7a9b9f_755663769600_4e76874a-36d8-54fd-a07e-6fc22dd54b6b"

containers:
  - name: "glm-5-2"
    image: "ghcr.io/tinfoilsh/confidential-glm5-2@sha256:8cc690cf5b1c26b0bc14894a7ca27890386b536930b69172678560220572648b" # v0.0.14
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - RUNAI_STREAMER_MEMORY_LIMIT: "4294967296"
      - RUNAI_STREAMER_CONCURRENCY: "8"
    command: ["--model", "/tinfoil/mpk/mpk-98d8b697173111b91b32a4daafc179bb5d8c5dbcd8fb8732f1f73ffcbc7a9b9f", "--kv-cache-dtype",
      "fp8", "--tensor-parallel-size", "8", "--decode-context-parallel-size", "8", "--dcp-sparse-indexer-mode", "union", "--attention-backend", "FLASHMLA_SPARSE",
      "--tool-call-parser", "glm47", "--enable-auto-tool-choice", "--reasoning-parser", "glm45", "--served-model-name",
      "glm-5-2", "--scheduling-policy", "priority", "--port", "8001", "--load-format", "runai_streamer",
      "--disable-custom-all-reduce", "--max-model-len", "393216",
      "--speculative-config", "{\"method\":\"mtp\",\"num_speculative_tokens\":5}"]
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=20g,mode=0700,exec
    secrets:
      - VLLM_API_KEY
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 120m

  - name: "finite-private-limiter"
    image: "ghcr.io/finitecomputer/finite-private-limiter:2026-07-02.glm52.health.1@sha256:f977b238439ff4caa3f416bf1ec8f16ed383640d7417262d26ed4388c8624d5c"
    restart: always
    env:
      - LISTEN_ADDR: "0.0.0.0:8002"
      - FINITE_USAGE_API_URL: "https://finite.computer"
      - UPSTREAM_BASE_URL: "http://127.0.0.1:8001"
      - FINITE_PRIVATE_MODEL: "glm-5-2"
      - DASHBOARD_URL: "https://finite.computer/dashboard"
      - READINESS_TIMEOUT_SECS: "5"
      - FINITE_USAGE_API_TIMEOUT_SECS: "15"
      - UPSTREAM_FIRST_BYTE_TIMEOUT_SECS: "120"
      - UPSTREAM_BODY_TIMEOUT_SECS: "600"
      - UPSTREAM_STREAM_IDLE_TIMEOUT_SECS: "600"
    secrets:
      - FINITE_USAGE_API_SERVICE_KEY
      - VLLM_INTERNAL_API_KEY
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/live"]
      interval: 30s
      timeout: 5s
      start_period: 120m

shim:
  upstream-port: 8002
  authenticated: false
  paths:
    - /v1/chat/completions
    - /v1/responses
    - /metrics
    - /live
    - /health
    - /ready

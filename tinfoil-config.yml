cvm-version: 0.7.5
cpus: 32
gpus: 8
memory: 524288

models:
  - name: "kimi-k2-6"
    repo: "moonshotai/Kimi-K2.6@7eb5002f6aadc958aed6a9177b7ed26bb94011bb"
    mpk: "baf763c7922bbafd337dc3aa86c9059f694169c51b1e0197d0d441aeea51186c_595205046272_7b0f3f16-bf8d-5206-8d14-088929943faf"

containers:
  - name: "kimi-k2-6"
    image: "vllm/vllm-openai:v0.21.0-ubuntu2404@sha256:45c2a37d44f68333c4f9ae51499baff54680d5e95b2c20799ca0f76afd09d461"
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    command: [
      "--model", "/tinfoil/mpk/mpk-baf763c7922bbafd337dc3aa86c9059f694169c51b1e0197d0d441aeea51186c",
      "--tensor-parallel-size", "8",
      "--mm-encoder-tp-mode", "data",
      "--served-model-name", "kimi-k2-6",
      "--enable-auto-tool-choice",
      "--enable-prompt-tokens-details",
      "--tool-call-parser", "kimi_k2",
      "--reasoning-parser", "kimi_k2",
      "--trust-remote-code",
      "--port", "8001",
      "--scheduling-policy", "priority",
      "--enable-chunked-prefill",
      "--enable-prefix-caching",
      "--prefix-caching-hash-algo", "sha256"
    ]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 60m

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/responses
  paths:
    - /v1/chat/completions
    - /v1/responses
    - /metrics
    - /health
